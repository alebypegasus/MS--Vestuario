version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ms2_mysql_server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql_setup_both.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
